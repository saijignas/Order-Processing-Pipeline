# Image: built directly on the node (`docker build -t order-pipeline:local .`)
# rather than pulled from a registry. This single free-tier VM has 1GB RAM
# total -- real headroom for a registry+CD pipeline exists, but wasn't worth
# spending on this box specifically. replicas: 1 for the same reason (2
# replicas each of producer/consumer was the original design intent, visible
# in git history, but doesn't fit here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: order-pipeline
spec:
  replicas: 1
  selector:
    matchLabels: {app: producer}
  template:
    metadata:
      labels: {app: producer}
    spec:
      initContainers:
        - name: init-db
          image: order-pipeline:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shared.init_db"]
          env:
            - {name: DATABASE_URL, value: "postgresql://orderuser:orderpass@postgres:5432/orders"}
      containers:
        - name: producer
          image: order-pipeline:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "producer.app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - {name: DATABASE_URL, value: "postgresql://orderuser:orderpass@postgres:5432/orders"}
            - {name: RABBITMQ_URL, value: "amqp://guest:guest@rabbitmq:5672/%2F"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  namespace: order-pipeline
spec:
  type: NodePort
  selector: {app: producer}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # http://<node-ip>:30080
