# Image pushed to GitHub Container Registry by CI (see .github/workflows/
# ci.yml) -- replace :latest with a specific tag once CD is wired up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: order-pipeline
spec:
  replicas: 2  # the point of decoupling producer from consumer: this can scale independently
  selector:
    matchLabels: {app: producer}
  template:
    metadata:
      labels: {app: producer}
    spec:
      initContainers:
        - name: init-db
          image: ghcr.io/saijignas/order-processing-pipeline:latest
          command: ["python", "-m", "shared.init_db"]
          env:
            - {name: DATABASE_URL, value: "postgresql://orderuser:orderpass@postgres:5432/orders"}
      containers:
        - name: producer
          image: ghcr.io/saijignas/order-processing-pipeline:latest
          command: ["uvicorn", "producer.app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - {name: DATABASE_URL, value: "postgresql://orderuser:orderpass@postgres:5432/orders"}
            - {name: RABBITMQ_URL, value: "amqp://guest:guest@rabbitmq:5672/%2F"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  namespace: order-pipeline
spec:
  type: NodePort
  selector: {app: producer}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # http://<node-ip>:30080
